<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cử tri phản ánh - MTTQ Xã Ea Súp</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="https://lh3.googleusercontent.com/d/1XNOTessI_TfWePqJzElF1oeH7gP2MlTn" alt="Logo MTTQ" class="logo">
            <div class="titles">
                <h1>ỦY BAN MẶT TRẬN TỔ QUỐC VIỆT NAM XÃ EA SÚP</h1>
                <h2>CỬ TRI PHẢN ÁNH</h2>
            </div>
        </header>

        <!-- Iframe ẩn để hứng phản hồi từ Google mà không bị lỗi CORS -->
        <iframe name="hiddenIframe" id="hiddenIframe" style="display:none;"></iframe>

        <form id="feedbackForm" class="form" target="hiddenIframe">
            <div class="form-group">
                <label for="fullName">Họ tên cử tri <span class="required">*</span></label>
                <input type="text" id="fullName" name="fullName" required placeholder="Nhập họ và tên...">
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ <span class="required">*</span></label>
                <input type="text" id="address" name="address" required placeholder="Thôn/Buôn, Xã Ea Súp...">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại liên hệ <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" required placeholder="Ví dụ: 0912345678" pattern="[0-9]+">
            </div>

            <div class="form-group">
                <label for="content">Nội dung phản ánh <span class="required">*</span></label>
                <textarea id="content" name="content" required placeholder="Vui lòng nhập nội dung phản ánh hoặc ý kiến đóng góp tại đây..." rows="5"></textarea>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">Gửi Ý Kiến</span>
                <span class="loader" style="display: none;"></span>
            </button>

            <div id="statusMessage" class="status-message" style="display: none;"></div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
